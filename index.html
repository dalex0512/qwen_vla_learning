<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VLA Modeling · Sổ tay học tập</title>
  <meta name="description" content="Sổ tay học tập và theo dõi lộ trình đọc paper VLA (Vision-Language-Action) modeling.">
  
  <!-- Typography Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/style.css?v=42.0">
  <link rel="stylesheet" href="assets/home.css?v=42.0">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('vla_theme_pref');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="page-home">
  <div class="backdrop" aria-hidden="true"><i class="orb orb--1"></i><i class="orb orb--2"></i><i class="orb orb--3"></i></div>
  <div class="scrollbar" id="scrollbar" aria-hidden="true"></div>
  <div class="shell">
    <header class="top">
      <a href="index.html" class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">VLA Modeling</span>
      </a>
      <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Đổi giao diện sáng/tối">
        <span class="theme-icon-wrap" aria-hidden="true">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
        <span class="theme-label">Tối</span>
      </button>
    </header>

    <section class="hero" aria-label="Giới thiệu">
      <div class="hero-text">
        <p class="eyebrow" id="hero-eyebrow">Sổ tay VLA</p>
        <h1 class="hero-title">
          <span class="w w-v"><em>Nhìn.</em><small>Vision</small></span>
          <span class="w w-l"><em>Hiểu lệnh.</em><small>Language</small></span>
          <span class="w w-a"><em>Hành động.</em><small>Action</small></span>
        </h1>
        <p class="hero-lead">Ba việc một robot cần làm được, và các paper giải thích cách làm. Đọc nền trước, rồi đi vào chuyên sâu.</p>
      </div>

      <aside class="ticket" aria-label="Paper đọc tiếp">
        <div class="ticket-top">
          <span class="ticket-label">Đọc tiếp</span>
          <h2 class="ticket-title" id="hero-focus-title">Đang tải...</h2>
          <p class="ticket-route" id="hero-focus-group"></p>
          <p class="ticket-desc" id="hero-focus-desc"></p>
        </div>
        <div class="ticket-bottom">
          <div class="pips" id="hero-pips" aria-hidden="true"></div>
          <p class="ticket-progress" id="hero-progress-sub"></p>
          <a href="#" id="hero-focus-cta" class="go">
            <span>Tiếp tục đọc</span>
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
          </a>
        </div>
      </aside>
    </section>

    <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

    <main id="route" class="route" aria-label="Lộ trình các paper"></main>

    <a class="dock" id="dock" href="#" aria-label="Đọc tiếp">
      <span class="dock-pips" id="dock-pips" aria-hidden="true"></span>
      <span class="dock-text"><small>Đọc tiếp</small><b id="dock-title"></b></span>
      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
    </a>

    <footer class="foot">
      <span><b>VLA Modeling</b> · Sổ tay học tập</span>
      <span>Đổi trạng thái paper trong papers.js</span>
    </footer>
  </div>

  <script src="papers.js?v=42.0"></script>
  <script src="assets/app.js?v=42.0"></script>
</body>
</html>
